# Simulation (hrg/sim_env.py): the FR3 + 2F-85, one object, optional moving
# obstacles. Use the same object_config for the env and the controller.
# Keys: k = push the hand, o = move the object, r = reset.
scene_xml_path: assets/robot/scene_sim.xml
env_mode: sim_real_time
vis_mode: vis_on           # vis_off: headless
sim_steps_per_control: 1
sim_freq: 1000
view_freq: 30
col_info_update_dt: 0.1    # s, collision geometry republished

object_config: configs/objects/blue_bowl.yaml
object_pose_update_dt: 0.033   # s, object pose rate (~FoundationPose)
obj_spawn_xy_center: [0.5, 0.0]
obj_spawn_xy_half: [0.05, 0.1]
obj_spawn_yaw_half: 3.1416
obj_spawn_rpy: null        # e.g. [1.5708, 0, 0]: the object lies on its side (Table I)
obj_spawn_seed: 0

# Perturbations (paper Fig. 7)
push_force: 80.0           # N, key k: horizontal, random direction
push_duration: 0.3         # s
jump_xy_half: [0.1, 0.18]  # key o: new place within this of obj_spawn_xy_center
place_clearance: 0.03      # m, never place the object this close to the hand
# Moving obstacles (paper Fig. 8): configs/sim/env_obstacles.yaml
obstacles: []

platform:
  name: franka_fr3
  default_q_values: [0.0, 0.0, 0.0, -1.5707963, 0.0, 1.5707963, 0.0]   # start pose
  default_gripper_width: 0.085
  gravity_comp: false      # the controller sends g(q)
  arm_joint_meas_freq: 1000
  gripper_meas_freq: 100

sub_manager:
  ctrl_channel: franka_arm_joint_ctrl
  gripper_cmd_channel: franka_gripper_cmd
  num_joints: 7
  max_sub_freq: 2000

pub_manager:
  arm_joint_meas_channel: franka_arm_joint_meas
  gripper_joint_meas_channel: franka_gripper_joint_meas
  gripper_state_channel: franka_gripper_state
  static_col_info_channel: franka_static_col_info
  robot_col_info_channel: franka_robot_col_info
  object_pose_channel: franka_object_pose
  obstacles_channel: franka_obstacles
  max_pub_freq: 2000
