# FoundationPose for the perception -> grasping pipeline on the REAL robot
# (ZED camera ext1 via run_sensors.py, configs/robot/zed.yaml).
# The camera extrinsics in that file must be calibrated against the FR3 base.
name: foundation_pose_tracking_sam2

object_name: "predefined_obj"
# The object's mesh in the object frame (= the fingertip targets' frame):
# visual_textured.obj where the scan has a texture (FoundationPose matches colour
# too: bowl, mug, plate), else visual.obj (wine glass, red cup, tape).
mesh_file: assets/objects/blue_bowl/visual_textured.obj

est_refine_iter: 1
track_refine_iter: 2

# Leave null to draw ROI interactively on first frame (or click object directly).
scene_roi: null

sam2:
  config_file: "configs/sam2.1/sam2.1_hiera_t.yaml"
  hf_repo: "facebook/sam2.1-hiera-tiny"
  hf_filename: "sam2.1_hiera_tiny.pt"
  mask_rgb: false
  mask_depth: false
  obj_id: 1

auto_reset:               # score-based (its level depends on the object: off for the gold bowl)
  enable: true
  score_threshold: 100.0
  streak: 3

# Lost tracking, any object: the model projected with the tracked pose must cover
# the SAM2 mask; if not for `streak` frames, no pose is published and the object
# is registered again from the mask (a dropped / moved object is picked up again).
# While tracking: click the object = re-select it, r = register again.
lost_detect:
  enable: true
  min_agreement: 0.5       # fraction of the model's projected points inside the mask
  streak: 3

visualize_sam: true
debug: 0
debug_dir: debug_output
visualize: true

quiet_logs: true
fps_report_every: 30

# Low-pass on SE(3) (fr3/utils/filtering/SE3LowPassFilter.py). Raw FoundationPose on the
# gold bowl at rest, 24 Hz (2026-10-28): 1.2 mm / 0.6 deg per frame (median), 3.8 mm / 2.7
# deg max. alpha 0.4 roughly halves the frame-to-frame jitter for ~60 ms of lag.
pose_filter:
  use_filter: true
  alpha: 0.4
  window_size: 0
  fix_x_rotation: false
  fix_z_rotation: false

sub_manager:
  name: single_rgbd
  rgbd_channel: zed_ext1
  max_sub_freq: 2000
pub_manager:
  name: named_vec
  named_vec_list_channel: fp_obj_pose
  max_pub_freq: 2000
# Output goes to run_pose_bridge.py (configs/robot/pose_bridge.yaml).
