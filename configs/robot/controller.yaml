# The controller on the real FR3, on top of configs/controller.yaml:
#   python run_controller.py --config configs/controller.yaml configs/robot/controller.yaml \
#       --object_config configs/objects/blue_bowl.yaml
env_mode: real
# Friction feed-forward on the commanded velocity, measured 2026-10-28 by
# scripts/robot/identify_friction.py (outputs/friction/friction_20261028_205622.npz).
friction:
  scale: 0.5
  coulomb: [1.216, 1.430, 1.057, 1.366, 1.143, 0.734, 0.803]   # Nm
  viscous: [1.697, 1.376, 0.969, 1.393, 0.401, 0.462, 0.141]   # Nm s/rad
  v_smooth: 0.02
  max: [1.22, 1.43, 1.06, 1.37, 1.14, 0.73, 0.80]   # Nm, never above the measured Coulomb friction
grasp:
  # 1 cm, as in sim: the measured pose noise is ~1 mm (configs/robot/foundation_pose.yaml),
  # and on the straight final approach an early close lands above a rim (the paper's
  # 1.5 cm closed 12-13 mm early and missed the gold bowl's wall, 2026-10-28).
  grasp_trigger_dist: 0.01
  # The tabletop is ~1.2 cm above the robot's mounting surface (base z = 0):
  # the calibrated camera puts the AprilTag on it at z = 1.1 cm and a bowl's
  # base at 1.3 cm (2026-10-26), and it looks slightly higher by eye.
  table_z: 0.012
# Gamma(q): the real cell's (virtual) floor and walls, published by
# run_hardware.py from assets/robot/scene_real_cell.xml.
col_pairs:
  - [fr3_link2, wall_front]
  - [fr3_link2, wall_left]
  - [fr3_link3, wall_front]
  - [fr3_link3, wall_left]
  - [fr3_link3, floor]
  - [fr3_link4, wall_front]
  - [fr3_link4, wall_left]
  - [fr3_link4, floor]
  - [fr3_link5, wall_front]
  - [fr3_link5, wall_left]
  - [fr3_link5, floor]
  - [fr3_link5__2, wall_front]
  - [fr3_link5__2, wall_left]
  - [fr3_link5__2, floor]
  - [fr3_link6, wall_front]
  - [fr3_link6, wall_left]
  - [fr3_link6, floor]
  - [fr3_link7, wall_front]
  - [fr3_link7, wall_left]
  - [fr3_link7, floor]
  - [fr3_link7__2, wall_front]
  - [fr3_link7__2, wall_left]
  - [fr3_link7__2, floor]
  - [fr3_gripper, wall_front]
  - [fr3_gripper, wall_left]
  - [fr3_gripper__2, wall_front]
  - [fr3_gripper__2, wall_left]
