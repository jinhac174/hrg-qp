# Gravity compensation on the real FR3 (run_grav_comp.py): move the arm by hand,
# e.g. for the camera calibration (run_camera_calibration.py).
ctrl_freq: 1000
env_mode: real
# The model run_hardware.py holds the arm with (gravity_urdf in hardware.yaml).
urdf_path: assets/robot/urdf/fr3_robotiq_rigid.urdf
arm_damping: 0.5           # Nm per rad/s: light, keeps the floating arm from drifting
# Coulomb friction compensation on the measured velocity (lighter by hand), measured
# 2026-10-28 by scripts/robot/identify_friction.py (outputs/friction/friction_20261028_205622.npz).
# scale < 1: the compensation stays below the friction it opposes. Joint 1 (vertical axis,
# no gravity on it, the stiffest) gets more.
friction:
  scale: [0.65, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
  coulomb: [1.216, 1.430, 1.057, 1.366, 1.143, 0.734, 0.803]   # Nm
  v_smooth: 0.05           # rad/s, well above the velocity noise
  v_fade: 0.5              # rad/s: x 1/(1 + (qd/v_fade)^2), light to move, a thrown arm stops sooner
  max: [1.22, 1.43, 1.06, 1.37, 1.14, 0.73, 0.80]   # Nm, never above the measured Coulomb friction

sub_manager:
  arm_joint_meas_channel: franka_arm_joint_meas
  max_sub_freq: 2000
pub_manager:
  ctrl_channel: franka_arm_joint_ctrl
  max_pub_freq: 2000
