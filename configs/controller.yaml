# The reactive grasp controller (hrg/controller.py) in simulation.
# Robot: --config configs/controller.yaml configs/robot/controller.yaml
ctrl_freq: 1000
plan_freq: 100              # the paper's planner rate
env_mode: sim_real_time

urdf_path: assets/robot/urdf/fr3_robotiq_rigid.urdf
default_q_values: [0.0, 0.0, 0.0, -1.5707963, 0.0, 1.5707963, 0.0]   # home (key h)
# Same file as the env's object_config: mesh, distance function (sdf) and
# fingertip targets (scripts/prepare_objects.py).
object_config: configs/objects/blue_bowl.yaml

# ---------------------------------------------------------------- the method (hrg/planner.py)
hrg:
  field: path              # path: eqs. (3)-(5); linear: the eq. (2) baseline
  # eq. (5): fingertip speed
  # Speed (docs/method.md): v_const <= a H, the braking the collision rows can demand within
  # the horizon (hand acceleration ~5-8 m/s^2 at the joint limits below, H = 0.10 s), and the
  # eq. (5) slow-down's own peak deceleration ~1.5 v_const^2 / delta_x within that acceleration
  # (0.5 m/s, 10 cm: 3.8 m/s^2). 0.8 m/s with 8 cm needs 12 m/s^2: the plans then ride the
  # acceleration bounds and the arm shakes.
  v_const: 0.5             # m/s far from the target
  delta_x: 0.10            # m, quadratic slow-down radius
  # eq. (2) baseline: K = linear_gain * I
  linear_gain: 1.0         # 1/s
  # eq. (3): fingertip paths (paper Sec. II-D)
  num_knots: 100
  num_via_samples: 100     # via directions for the initial 2-segment path
  via_dist: 0.10           # m, via point this far from the target
  sqp_iters: 3             # SQP iterations per plan
  sqp_step_bound: 0.02     # m, SQP trust region per knot and iteration
  max_separation: 0.085    # m, |c1(s) - c2(s)| <= the 2F-85's opening
  eps_obj: 0.01            # m, target object (paper: 1 cm)
  eps_obs: 0.05            # m, obstacles (paper: 5 cm)
  eps_table: 0.01          # m
  # eq. (12): target selection, sum of fingertip distances + w * angle
  select_w_angle: 0.05     # m per rad
  # eqs. (6)-(8): grasp stability (identically zero on the 2F-85)
  eta_g: 0.15              # rad
  T_g: 0.05
  # eqs. (9)-(10): gripper posture
  w_nominal: 0.085         # m, open
  v_gr: 0.15               # m/s, the 2F-85's fastest
  delta_gr: 0.02           # m
  eta_h: 0.06              # m: below this fingertip error the posture field fades out
  T_h: 0.02
  # eq. (11): QP
  horizon: 0.10            # s, H: must exceed the closed-loop latency (~40 ms command -> joint velocity), see docs/method.md
  qp_reg: 0.001            # z^T z regulariser (the cost has rank 6 of 8 once alpha, beta -> 0)
  qp_eps_obj: 0.01         # m, hand spheres vs target object
  qp_eps_obs: 0.02         # m, hand spheres vs obstacles
  qp_eps_table: 0.005      # m, hand spheres vs table
  sep_rate_max: 0.25       # m/s, demanded separation rate when inside a margin
  # The oriented reach (not in the paper; docs/superpowers/specs/2026-10-28-oriented-reach-design.md):
  # every target pair has hand orientations in the object frame (one per admissible
  # approach and finger order); the grasp is chosen in joint space (the arm motion to
  # its IK configuration + a cost for leaving the object's preferred approach,
  # configs/objects/*.yaml approach_axis), and eq. (11) also tracks the hand
  # orientation and that configuration; the last approach_dist come straight in.
  orient: true             # false: the paper's reach (fingertip points only)
  rot_weight: 0.1          # alpha full weight: alpha(theta) |J_r,b qdot - w_des,b|^2 per vector pair
  rot_gain: 3.0            # 1/s, w_des,b = R^T sat(rot_gain (R n_b) x n_t, rot_max)
  rot_max: 1.5             # rad/s
  rot_threshold: 30.0      # deg, alpha full above, linear to 0 below (3 sin 30 deg = the cap)
  approach_dist: 0.10      # m, straight final approach along the target's approach axis
  posture_weight: 0.05     # |qdot - posture_gain (q_grasp - q)|^2: the chosen grasp configuration
  posture_gain: 3.0        # 1/s
  select_w_pref: 2.0       # rad of joint motion per rad off the object's preferred approach
  select_shortlist: 6      # new grasp candidates solved by IK per plan
  # Once a grasp is chosen the posture field (eq. 9) opens the gripper to the targets' opening
  # + this on each side instead of fully, so the fingers straddle the object as they come in
  # and the width never limits the straight approach (0: the paper's w_nominal throughout).
  preshape_margin: 0.01    # m
  # Smoothness (docs/method.md, "Smoothness"; hrg/profile.py). What the references may do: the
  # fingertips' velocity moves toward the field's within task_accel / task_jerk (below 6 m/s^2 the
  # hand cuts the corners of the path around the object and the reach takes twice as long), the
  # hand's turn and the joints' posture field likewise.
  task_accel: 6.5          # m/s^2
  task_jerk: 150.0         # m/s^3
  rot_accel: 15.0          # rad/s^2
  rot_jerk: 300.0          # rad/s^3
  posture_vmax: 0.9        # rad/s (norm)
  posture_accel: 5.0       # rad/s^2
  posture_jerk: 80.0       # rad/s^3
  # The arm's self-motion (ReachPlanner._null_task): priced, or the QP pours motion into it
  # whenever a row binds. null_lambda: singular values of the Jacobian below this count as
  # self-motion. Above ~0.06 it starts to price real hand motion too (the weakest is ~0.18):
  # the lift then stalls short of its goal.
  null_weight: 1.0
  null_gain: 2.0           # 1/s, back to the configuration at the grasp (after the grasp)
  null_lambda: 0.03

# Gamma(q) of eq. (11): robot vs environment (the scene's floor / wall_* geoms,
# published by the env / run_hardware.py) and vs itself.
joint_velocity_limit: [2, 2, 2, 2, 2.5, 2.5, 2.5]           # rad/s (hardware.yaml brakes above its max_joint_vel)
# The FR3's own velocity limits fall toward the ends of each joint's range (fr3/robot_platform/
# fr3_limits.py; joint 4 at -2.68 rad: 1.42 rad/s toward its end) and the robot stops above them
# (joint_velocity_violation). The QP plans within this fraction of them: the arm follows a
# command with an error (~0.1 rad/s at speed).
joint_velocity_limit_scale: 0.8
# The QP changes its velocity by at most these per plan period (|z - z_prev| <= a dt): the plan is
# a profile the arm can follow, and the low level feeds the acceleration forward (hrg/lowlevel.py).
joint_acceleration_limit: [8, 8, 8, 8, 8, 8, 8]    # rad/s^2, within the FR3's 10 (FCI docs, libfranka): the arm follows with an error
# ... and the torque each plan asks of the arm, M(q) a + g(q) + C(q, v) v (the low level's feed-forward),
# within this fraction of the FR3's torque (87 / 12 Nm) and torque rate (1000 Nm/s: per plan period,
# M (a - a_prev) <= 7 Nm), the rest left to the Kd feedback and a held object. Faster changes reach the
# robot rate-limited, late, and with them the Kd term: the arm lagged its plan by 50 ms, overshot the
# lift by 2 cm and joints 1 / 3 shook until a reflex (2026-11-02, outputs/logs/bus_20261102_17*.lcm).
joint_torque_limit_scale: 0.7
# ... and each joint's acceleration changes by at most this per second (rad/s^3, per plan period
# 2 rad/s^2): the FR3's torque follows its command 15-40 ms late (flight recorder, 2026-11-02),
# so an acceleration reaches the joint over ~30 ms, and more than ~300 rad/s^3 is not followed. Plans that
# switched +-10 rad/s^2 from one period to the next kicked the light joint 1 / 3 counter-motion
# (0.2 kg m^2) into an 8 Hz oscillation on the robot.
joint_jerk_limit: [200, 200, 200, 200, 200, 200, 200]
width_acceleration_limit: 2.0                              # m/s^2, the 2F-85's set-point response
env_col_margin: 0.02
self_col_margin: 0.02
# The hand's own boxes are not checked against the floor: the hand spheres vs
# table rows do that (qp_eps_table), so fingertips can reach low targets.
col_pairs:
  - [fr3_link2, wall_back]
  - [fr3_link2, wall_left]
  - [fr3_link3, wall_back]
  - [fr3_link3, wall_left]
  - [fr3_link3, floor]
  - [fr3_link4, wall_back]
  - [fr3_link4, wall_left]
  - [fr3_link4, floor]
  - [fr3_link5, wall_back]
  - [fr3_link5, wall_left]
  - [fr3_link5, floor]
  - [fr3_link5__2, wall_back]
  - [fr3_link5__2, wall_left]
  - [fr3_link5__2, floor]
  - [fr3_link6, wall_back]
  - [fr3_link6, wall_left]
  - [fr3_link6, floor]
  - [fr3_link7, wall_back]
  - [fr3_link7, wall_left]
  - [fr3_link7, floor]
  - [fr3_link7__2, wall_back]
  - [fr3_link7__2, wall_left]
  - [fr3_link7__2, floor]
  - [fr3_gripper, wall_back]
  - [fr3_gripper, wall_left]
  - [fr3_gripper__2, wall_back]
  - [fr3_gripper__2, wall_left]
# Self-collision: the pairs Franka's SRDF leaves enabled.
self_col_pairs:
  - [fr3_link5, fr3_link0]
  - [fr3_link5__2, fr3_link0]
  - [fr3_link6, fr3_link0]
  - [fr3_link7, fr3_link0]
  - [fr3_link7__2, fr3_link0]
  - [fr3_gripper__2, fr3_link0]
  - [fr3_gripper, fr3_link0]
  - [fr3_link5, fr3_link1]
  - [fr3_link5__2, fr3_link1]
  - [fr3_link6, fr3_link1]
  - [fr3_link7, fr3_link1]
  - [fr3_link7__2, fr3_link1]
  - [fr3_gripper__2, fr3_link1]
  - [fr3_gripper, fr3_link1]
  - [fr3_link5, fr3_link2]
  - [fr3_link5__2, fr3_link2]
  - [fr3_link7, fr3_link2]
  - [fr3_link7__2, fr3_link2]
  - [fr3_gripper__2, fr3_link2]
  - [fr3_gripper, fr3_link2]
  - [fr3_gripper__2, fr3_link5]
  - [fr3_gripper, fr3_link5]
  - [fr3_gripper__2, fr3_link5__2]
  - [fr3_gripper, fr3_link5__2]

# ---------------------------------------------------------------- grasp, lift, home
grasp:
  table_z: 0.0
  grasp_trigger_dist: 0.01 # m, both fingertips this close: close (paper: 1 cm sim, 1.5 cm robot)
  grasp_trigger_rot: 10.0  # deg, and the hand this close to its target orientation (hrg.orient)
  grasp_force: 30.0        # N
  grasp_speed: 0.15        # m/s, the 2F-85's fastest
  gripper_timeout: 3.0     # s
  lift_height: 0.15        # m
  lift_tol: 0.01           # m
  lift_timeout: 3.0        # s (a 15 cm lift takes ~0.6 s; near the reach limit it may not finish)
  # The lift is a minimum-jerk motion within these (hrg/profile.py), 0.6 s for 15 cm at 0.5 m/s,
  # peak hand acceleration ~2.4 m/s^2, its error fed back through the pose field.
  lift_speed: 0.5          # m/s
  lift_accel: 3.0          # m/s^2
  lift_jerk: 40.0          # m/s^3
  lift_angular_speed: 2.0  # rad/s
  lift_angular_accel: 8.0  # rad/s^2
  lift_angular_jerk: 100.0 # rad/s^3
  lift_lag: 0.04           # s, how late the arm follows: the error is read from where the reference was then
  lift_pos_gain: 8.0       # 1/s
  lift_rot_gain: 5.0       # 1/s
  lift_rot_weight: 0.5
  # After the lift: the held object back to its upright pose (object +z up; the
  # smallest tilt, about the TCP, raised until it clears the table).
  upright: true
  upright_clearance: 0.03  # m, the upright object's lowest point above the table
  upright_tol: 3.0         # deg
  upright_timeout: 8.0     # s
  held_eps: 0.02           # m, the held object's points above the table (lift, upright)
  held_points: 64
  payload_comp: true       # while holding: the object's weight (its config mass) added to g(q)
  payload_ramp: 0.3        # s, it fades in and out over this
home_gain: 2.0             # 1/s
# Holding states (idle, close, reopen, hold): the joints where the state began,
# hold_gain (q_hold - q), at most hold_vmax rad/s, through the planner.
hold_gain: 10.0            # 1/s
hold_vmax: 1.0             # rad/s

# ---------------------------------------------------------------- low level (hrg/controller.py, hrg/lowlevel.py)
# qd_cmd: the plan's velocity ramped from the previous plan's over the plan period
# tau = kp (q_des - q) + kd (qd_cmd - qdot) + M(q) qdd_cmd + g(q) + C(q, qdot) qdot + tau_f(qd_cmd)
# ref_mode step (paper Sec. II-D): q_des = q + qd_cmd dt, so kp (q_des - q) is
# ~1 % of the kd term: kp = 0, a damping (velocity) controller; the planner feeds
# position back. inertia_ff: M(q) qdd_cmd, the command's acceleration fed forward,
# so the arm follows the plan's velocity profile instead of lagging it by M/kd
# (30-60 ms on joints 1-4). ref_mode integral: q_des += qd_cmd dt within max_ref_err
# (the earlier variant; with kp [600, 600, 600, 600, 250, 150, 50] an integral term).
ref_mode: step
kp: [0, 0, 0, 0, 0, 0, 0]
# Joints 1 and 3 turning against each other are the arm's lightest motion, and joint 1's torque is
# the latest: with 50 on both that mode has a damping ratio of 0.02-0.09 near 15 Hz at the poses used
# (unstable at 1 % of random poses; torque lags of configs/sim/env.yaml, the model's rotor inertia).
# 30 / 35: 0.12-0.18, none unstable. The feed-forward, not Kd, carries the motion. Joint 2 stays
# stiff: it hardly enters that mode and it carries the lift.
kd: [30, 50, 35, 20, 20, 20, 10]
inertia_ff: true
max_ref_err: 0.05          # rad, |q_des - q| bound (ref_mode integral)
max_plan_age: 0.2          # s, no new plan for this long: hold the joints (stale_hold_*)
stale_hold_kp: [300, 300, 300, 300, 125, 75, 25]
stale_hold_kd: [35, 35, 35, 15, 15, 15, 7]
# Friction feed-forward on the commanded velocity (zero when the command is):
# scale (coulomb tanh(qdot_des / v_smooth) + viscous qdot_des), capped at max.
# Sim: the MuJoCo model's frictionloss / damping (assets/robot/fr3_robotiq_robot.xml).
friction:
  scale: 0.5
  coulomb: [1.137, 1.137, 1.137, 1.137, 0.763, 0.44, 0.248]   # Nm
  viscous: [0.21, 0.21, 0.21, 0.21, 0.21, 0.21, 0.21]          # Nm s/rad
  v_smooth: 0.05           # rad/s (0.02 is a slope of 30 Nm s/rad at zero: it chatters as the command crosses zero at a halt)
  max: [1.0, 1.0, 1.0, 1.0, 0.5, 0.5, 0.3]                    # Nm
# The object pose carried forward at its estimated velocity between perception frames (30 Hz
# sim, ~24 Hz FoundationPose): a moving object's targets then move smoothly at the plan rate
# instead of stepping every 3-4 plans (each step hit the acceleration bounds: a shaking arm).
object_pose_predict: true
# Gripper width rate -> set-points a little ahead of the integrated width, each at the speed
# |wdot| (lowlevel.WidthStream): the fingers move continuously at the commanded rate.
width_stream_freq: 50.0    # Hz
width_max_lead: 0.01       # m, w_ref stays this close to the measured width (no wind-up)

sub_manager:
  arm_joint_meas_channel: franka_arm_joint_meas
  gripper_state_channel: franka_gripper_state
  static_col_info_channel: franka_static_col_info
  robot_col_info_channel: franka_robot_col_info
  object_pose_channel: franka_object_pose
  obstacles_channel: franka_obstacles
  max_sub_freq: 2000

pub_manager:
  ctrl_channel: franka_arm_joint_ctrl
  gripper_cmd_channel: franka_gripper_cmd
  fingertip_channel: franka_hrg_fingertips
  fingertip_paths_channel: franka_hrg_paths
  max_pub_freq: 2000
